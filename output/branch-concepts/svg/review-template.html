<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cernan · Branch structure review</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eaf5ff; color: #0b1a2b; font: 13px/1.5 ui-monospace, monospace; }
    .stage { position: relative; width: 100%; aspect-ratio: 8 / 5; overflow: hidden; background: url(../refs/background.png) center / 100% 100%; }
    .version { position: absolute; inset: 0; }
    .version > svg { display: block; width: 100%; height: 100%; }
    [hidden] { display: none !important; }
    .stage:not(.show-paths) [id$="channels"], .stage:not(.show-paths) [id$="nodes"] { display: none; }
    .review { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; padding: 18px 28px; }
    .choices { display: flex; gap: 6px; flex-wrap: wrap; }
    button { font: inherit; border: 1px solid #0b1a2b33; background: transparent; color: inherit; padding: 10px 14px; min-height: 44px; border-radius: 5px; cursor: pointer; }
    button[aria-pressed="true"] { color: #fff; background: #0b1a2b; }
    button:focus-visible, input:focus-visible { outline: 2px solid #0b1a2b; outline-offset: 4px; }
    label { display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; }
    input { width: 16px; height: 16px; accent-color: #0b1a2b; }
    .caption { margin: 0; padding: 0 28px 22px; color: #4b6178; }
    @media (max-width: 600px) { .review { padding: 14px 16px; gap: 6px; } .caption { padding: 0 16px 18px; } }
  </style>
</head>
<body>
  <main>
    <div class="stage" id="stage" aria-label="Branch outlines on the existing Cernan sky background">
      <div class="version" id="refined">__REFINED_SVG__</div>
      <div class="version" id="original" hidden>__ORIGINAL_SVG__</div>
    </div>
    <div class="review">
      <div class="choices" role="group" aria-label="Outline version">
        <button type="button" data-version="refined" aria-pressed="true" aria-controls="refined">Refined outline</button>
        <button type="button" data-version="original" aria-pressed="false" aria-controls="original">Claude's outline</button>
      </div>
      <label><input type="checkbox" id="paths">Show signal paths</label>
    </div>
    <p class="caption" id="caption" aria-live="polite">Structure study · One connected branch, smooth forks, fewer clustered twigs.</p>
  </main>
  <script>
    const stage = document.getElementById('stage');
    const caption = document.getElementById('caption');
    document.querySelectorAll('[data-version]').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-version]').forEach(peer => peer.setAttribute('aria-pressed', String(peer === button)));
        document.querySelectorAll('.version').forEach(panel => { panel.hidden = panel.id !== button.dataset.version; });
        caption.textContent = button.dataset.version === 'refined'
          ? 'Structure study · One connected branch, smooth forks, fewer clustered twigs.'
          : 'Previous study · Original outline from the latest Claude Code session.';
      });
    });
    document.getElementById('paths').addEventListener('change', event => {
      stage.classList.toggle('show-paths', event.target.checked);
    });
  </script>
</body>
</html>
