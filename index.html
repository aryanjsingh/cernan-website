<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cernan</title>
<style>
  /* Theme: Atmos (sky blue). Tokens for upcoming text and buttons. */
  :root {
    --sky-top: #3d97e0;
    --sky-mid: #79bdf1;
    --sky-low: #b9defb;
    --sky-horizon: #eaf5ff;
    --ink: #0b1a2b;
    --ink-muted: #4b6178;
    --white: #ffffff;
    --glass: rgba(255, 255, 255, 0.42);
    --glass-border: rgba(255, 255, 255, 0.65);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--sky-low); color: var(--ink); -webkit-font-smoothing: antialiased; }
  body { overflow: hidden; }

  .sky {
    position: fixed; inset: 0;
    background:
      radial-gradient(120% 80% at 50% 120%, var(--white) 0%, rgba(255,255,255,0) 55%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 38%, var(--sky-low) 70%, var(--sky-horizon) 100%);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .grain {
    position: fixed; inset: 0; pointer-events: none; opacity: .18; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  /* ---------- Top row ---------- */
  body { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 28px 40px;
    opacity: 0; animation: fadein 1s ease .1s forwards;
  }
  @keyframes fadein { to { opacity: 1; } }

  .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; justify-self: start; }
  .brand svg { width: 22px; height: 22px; display: block; }
  .brand span { font-size: 15px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }

  .menu { display: flex; align-items: center; gap: 36px; list-style: none; }
  .menu a {
    color: var(--ink); opacity: .62; text-decoration: none;
    font-size: 13px; font-weight: 400; letter-spacing: 0.01em;
    transition: opacity .2s;
  }
  .menu a:hover { opacity: 1; }

  .book {
    justify-self: end; position: relative; display: inline-flex; align-items: center; gap: 10px;
    height: 40px; padding: 0 8px 0 18px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.92); color: var(--ink); text-decoration: none;
    font-size: 12.5px; font-weight: 500; letter-spacing: 0.01em;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.9), 0 1px 2px rgba(11, 26, 43, 0.06), 0 8px 24px rgba(30, 90, 150, 0.18);
    transition: background .25s, box-shadow .25s;
  }
  .book .label { position: relative; display: block; height: 16px; overflow: hidden; line-height: 16px; }
  .book .label span { display: block; transition: transform .45s cubic-bezier(.65, 0, .35, 1); }
  .book .label span + span { position: absolute; left: 0; top: 0; transform: translateY(100%); }
  .book .chip {
    width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    background: var(--ink); color: var(--white); overflow: hidden; position: relative;
  }
  .book .chip svg { position: absolute; transition: transform .45s cubic-bezier(.65, 0, .35, 1); }
  .book .chip svg + svg { transform: translate(-150%, 150%); }
  .book:hover { background: #fff; box-shadow: 0 0 0 1px #fff, 0 1px 2px rgba(11, 26, 43, 0.08), 0 12px 32px rgba(30, 90, 150, 0.26); }
  .book:hover .label span:first-child { transform: translateY(-100%); }
  .book:hover .label span + span { transform: translateY(0); }
  .book:hover .chip svg:first-child { transform: translate(150%, -150%); }
  .book:hover .chip svg + svg { transform: translate(0, 0); }

  a:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 4px; border-radius: 4px; }

  @media (max-width: 720px) {
    .topbar { grid-template-columns: 1fr auto; padding: 20px; }
    .menu { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .topbar { animation: none; opacity: 1; } }

  /* Content goes here later */
  main { position: relative; z-index: 2; height: 100%; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
<div class="sky"></div>
<canvas id="clouds"></canvas>
<div class="grain"></div>
<header class="topbar">
  <a class="brand" href="#" aria-label="Cernan home">
    <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <defs>
        <mask id="needle-gap" maskUnits="userSpaceOnUse">
          <rect width="100" height="100" fill="#fff"/>
          <path d="M81 8.4 L56.6 52.2 L22.7 86.5 L45.6 43.7 Z" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
        </mask>
      </defs>
      <g mask="url(#needle-gap)" stroke="currentColor">
        <circle cx="50" cy="48" r="36.5" stroke-width="3.2"/>
        <path d="M50 11.7v7.4M50 77v7.4M15 48h7.6M78 48h7.4" stroke-width="3"/>
      </g>
      <path d="M81 8.4 L56.6 52.2 L22.7 86.5 L45.6 43.7 Z" fill="currentColor" stroke="currentColor" stroke-width="0.6" stroke-linejoin="round"/>
      <circle cx="50.7" cy="47.8" r="5.4" fill="#79bdf1" stroke="currentColor" stroke-width="2.4"/>
      <circle cx="50.7" cy="47.8" r="2.6" fill="currentColor"/>
    </svg>
    <span>Cernan</span>
  </a>
  <nav aria-label="Main">
    <ul class="menu">
      <li><a href="#research">Research</a></li>
      <li><a href="#faqs">FAQs</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
  <a class="book" href="#book">
    <span class="label"><span>Book a meeting</span><span aria-hidden="true">Book a meeting</span></span>
    <span class="chip"><svg width="10" height="10" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 9L9 3M9 3H4M9 3V8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><svg width="10" height="10" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 9L9 3M9 3H4M9 3V8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </a>
</header>
<main></main>
<script>
// Soft drifting cloud field with sun glow
const c = document.getElementById('clouds'), x = c.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, dpr, clouds = [];
function puff(cx, cy, r, a) {
  const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, `rgba(255,255,255,${a})`);
  g.addColorStop(0.6, `rgba(255,255,255,${a * 0.45})`);
  g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
}
function make() {
  clouds = [];
  for (let i = 0; i < 9; i++) {
    const depth = Math.random();
    const blobs = [];
    const n = 6 + (Math.random() * 6 | 0);
    for (let j = 0; j < n; j++) blobs.push({ ox: (Math.random() - .5) * 420, oy: (Math.random() - .5) * 70 - j * 2, r: 60 + Math.random() * 120 });
    clouds.push({ x: Math.random() * W * 1.4 - W * 0.2, y: H * (0.45 + depth * 0.5), s: 0.6 + depth * 0.9, v: 0.06 + depth * 0.22, a: 0.18 + depth * 0.32, blobs });
  }
  clouds.sort((a, b) => a.s - b.s);
}
function size() {
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0); make();
}
addEventListener('resize', size); size();
function frame() {
  x.clearRect(0, 0, W, H);
  for (const cl of clouds) {
    for (const b of cl.blobs) puff(cl.x + b.ox * cl.s, cl.y + b.oy * cl.s, b.r * cl.s, cl.a);
    cl.x += cl.v; if (cl.x - 400 * cl.s > W) cl.x = -400 * cl.s;
  }
  const g = x.createRadialGradient(W * 0.82, H * 0.12, 0, W * 0.82, H * 0.12, W * 0.35);
  g.addColorStop(0, 'rgba(255,255,255,0.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  if (!reduce) requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
